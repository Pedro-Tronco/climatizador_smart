[project]
name = "trabalho-g2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Pedro A. N. Tronco", email = "pedro_augusto_nalin_tronco@outlook.com.br" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "pyserial>=3.5",
    "rpi-lgpio>=0.6",
    "rplcd>=1.4.0",
    "sqlmodel>=0.0.50",
    "tornado>=6.6.1",
    "typing-extensions>=4.16.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
trabalho-g2 = "trabalho_g2:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
